<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Acessar</title>

    <link rel="stylesheet" href=".../CSS/style.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="logo">

                <img src="/IMG/logo.png" alt="Logo do Acessar" class="app-logo">

                <h1>Cadastro</h1>

            </div>

            <p class="login-subtitle">
                Cadastre-se para ter acesso aos recursos de acessibilidade
            </p>


            <form onsubmit="cadastrarUsuario(event)">

                <!-- Nome -->
                <div class="form-group">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" autocomplete="name"
                        required>

                </div>


                <!-- E-mail -->
                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" autocomplete="email"
                        required>

                </div>


                <!-- Senha -->
                <div class="form-group">

                    <label for="senha">
                        Senha
                    </label>

                    <input type="password" id="senha" name="senha" placeholder="Crie uma senha"
                        autocomplete="new-password" required>

                </div>


                <!-- Tipo de deficiência -->
                <div class="form-group">

                    <label for="deficiencia">
                        Tipo de deficiência
                    </label>

                    <select id="deficiencia" name="deficiencia" required>

                        <option value="">
                            Selecione
                        </option>

                        <option value="visual">
                            Deficiência visual
                        </option>

                        <option value="auditiva">
                            Deficiência auditiva
                        </option>

                        <option value="motora">
                            Deficiência físico-motora
                        </option>

                        <option value="intelectual">
                            Deficiência intelectual
                        </option>

                        <option value="multipla">
                            Deficiência múltipla
                        </option>

                    </select>

                </div>


                <!-- Botão -->
                <button type="submit" class="btn-primary">
                    Criar conta
                </button>

            </form>


            <!-- Link para login -->
            <p class="register-text">

                Já possui uma conta?

                <a href="login.html">
                    Entrar
                </a>

            </p>

        </section>

    </main>


    <script src=".../JS/script.js"></script>

</body>

</html>
