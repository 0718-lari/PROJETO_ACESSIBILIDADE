<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início - Acessar</title>
    <link rel="stylesheet" href="/CSS/style.css">
</head>

<body>
    <header class="header">

        <div class="header-logo">

            <nav class="navigation">
                <a href="home.html">Início</a>
                <a href="#">Rotas</a>
                <a href="#">Recursos</a>
                <a href="perfil.html">Perfil</a>
            </nav>

        </div>

        <div class="header-actions">
            <button id="notificationButton" class="theme-toggle" aria-label="Notificações">
                🔔
            </button>
    
            <button id="themeToggle" class="theme-toggle" aria-label="Alternar tema">
                🌙
            </button>

            <button class="logout-button" onclick="fazerLogout()">Sair</button>

            <div id="notificationPanel" class="notification-panel" hidden>
                <h3>Notificações</h3>
                <div id="notificationList" class="notification-list"></div>
            </div>
        </div>

    </header>

    <main class="home-container">
        <section class="profile-section">
            <h1>Meu perfil</h1>
            <p>Confira as informações cadastradas na sua conta.</p>
            <h2 id="perfilNome"></h2>
            <div class="profile-data">
                <p>
                    <strong>Nome:</strong>
                    <span id="perfilNomeCompleto"></span>
                </p>

                <p>
                    <strong>E-mail:</strong>
                    <span id="perfilEmail"></span>
                </p>

                <p>
                    <strong>Tipo de deficiência:</strong>
                    <span id="perfilDeficiencia"></span>
                </p>
            </div>

        </section>
    </main>
    <script src="/JS/script.js"></script>
    <script>carregarPerfil()</script>
</body>

</html>
