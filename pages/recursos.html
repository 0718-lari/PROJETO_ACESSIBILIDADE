<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Recursos - Acessar</title>

    <link
        rel="stylesheet"
        href="/CSS/style.css"
    >

</head>

<body>

    <!-- ==============================
         CABEÇALHO
         ============================== -->

    <header class="header">

        <div class="header-logo">

            <nav
                class="navigation"
                aria-label="Navegação principal"
            >

                <a href="home.html">
                    Início
                </a>

                <a href="rotas.html">
                    Rotas
                </a>

                <a href="recursos.html">
                    Recursos
                </a>

                <a href="perfil.html">
                    Perfil
                </a>

            </nav>

        </div>


        <div class="header-actions">

            <!-- Notificações -->

            <button
                id="notificationButton"
                class="theme-toggle"
                aria-label="Notificações"
                aria-expanded="false"
                aria-controls="notificationPanel"
                type="button"
            >
                🔔
            </button>


            <!-- Tema -->

            <button
                id="themeToggle"
                class="theme-toggle"
                aria-label="Alternar tema"
                type="button"
            >
                🌙
            </button>


            <!-- Sair -->

            <button
                class="logout-button"
                onclick="fazerLogout()"
                type="button"
            >
                Sair
            </button>


            <!-- Painel de notificações -->

            <div
                id="notificationPanel"
                class="notification-panel"
                hidden
            >

                <h3>
                    Notificações
                </h3>

                <div
                    id="notificationList"
                    class="notification-list"
                    aria-live="polite"
                ></div>

            </div>

        </div>

    </header>


    <!-- ==============================
         CONTEÚDO
         ============================== -->

    <main class="home-container">

        <section class="resources-page-section">

            <h1>
                Recursos de acessibilidade
            </h1>

            <p class="resources-page-subtitle">
                Encontre recursos que podem facilitar sua
                mobilidade e tornar seus deslocamentos mais acessíveis.
            </p>


            <!-- ==============================
                 RECURSOS RECOMENDADOS
                 ============================== -->

            <section class="resources-section">

                <h2>
                    Recursos recomendados para você
                </h2>

                <div
                    id="recursosPaginaContainer"
                    class="resources-grid"
                ></div>

            </section>


            <!-- ==============================
                 OUTROS RECURSOS
                 ============================== -->

            <section class="all-resources-section">

                <h2>
                    Outros recursos de acessibilidade
                </h2>

                <div
                    id="todosRecursosContainer"
                    class="resources-grid"
                ></div>

            </section>

        </section>

    </main>


    <!-- JavaScript -->

    <script src="/JS/script.js"></script>

    <script>
        carregarRecursosPagina();
    </script>

</body>

</html>
